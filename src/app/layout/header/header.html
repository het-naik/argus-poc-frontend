<mat-toolbar color="primary" class="app-toolbar">

  <nav class="nav-links">
    <a mat-button routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a mat-button routerLink="/orders" routerLinkActive="active-link">Orders</a>
    @if(showDashboardLink()) {
      <a mat-button [routerLink]="dashboardRoute()" routerLinkActive="active-link">Dashboard</a>
    }
  </nav>

  <span class="spacer"></span>

  <button mat-stroked-button color="warn" class="logout-button" (click)="logout()">
    <mat-icon>logout</mat-icon>
    Logout
  </button>

</mat-toolbar>
