<div class="cart-page">
  <h2 class="page-title">Shopping Cart</h2>

  <div class="layout">

    <div class="table-card mat-elevation-z2">
      <div class="table-scroll">
        <table mat-table [dataSource]="cart()?.cartItems || []">

          <ng-container matColumnDef="product">
            <th mat-header-cell *matHeaderCellDef>Product</th>
            <td mat-cell *matCellDef="let item">
              <span class="product-name">{{ item?.productName }}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="pricePerUnit">
            <th mat-header-cell *matHeaderCellDef class="right">Price</th>
            <td mat-cell *matCellDef="let item" class="right">{{ priceOf(item) }}</td>
          </ng-container>

          <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef class="center">Quantity</th>
            <td mat-cell *matCellDef="let item" class="center">
              <div class="qty">
                <button mat-icon-button (click)="decrement(item)" [disabled]="item.quantity <= 1"
                  aria-label="Decrease quantity">
                  <mat-icon>remove</mat-icon>
                </button>
                <span>{{ item.quantity }}</span>
                <button mat-icon-button (click)="increment(item)" aria-label="Increase quantity">
                  <mat-icon>add</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="center">Remove</th>
            <td mat-cell *matCellDef="let item" class="center">
              <button mat-icon-button color="warn" (click)="removeItem(item)" aria-label="Remove item">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <ng-container matColumnDef="subtotal">
            <th mat-header-cell *matHeaderCellDef class="right">Subtotal</th>
            <td mat-cell *matCellDef="let item" class="right subtotal">{{ subtotal(item) }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell empty" [attr.colspan]="displayedColumns.length">
              Your cart is empty.
            </td>
          </tr>
        </table>
      </div>
    </div>

    <aside>
      <mat-card appearance="outlined" class="summary">
        <h2 class="card-title">Order Summary</h2>
        <div class="summary-body">
          <div class="row"><span>Items</span><span>{{ itemCount() }}</span></div>
          <div class="row total"><span>Total</span><span>{{ total() }}</span></div>


        </div>
      </mat-card>
    </aside>
  </div>
  @if (cart()?.cartItems?.length) {
  <div class="cart-actions">
    <button mat-stroked-button color="warn" (click)="clearCart()">
      <mat-icon>delete_sweep</mat-icon>
      Delete Cart
    </button>
  </div>
  }
</div>
