<form class="max-w-md w-full mx-auto p-6 bg-white rounded-xl shadow-md border border-slate-100" [formGroup]="form" (ngSubmit)="submit()">
  <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Create account</h1>

  @if (error()) {
    <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-600">
      {{ error() }}
    </div>
  }

  <div class="space-y-4">
   
    <label class="block">
      <span class="block text-sm font-medium text-slate-700 mb-1">Username</span>
      <input 
        formControlName="username" 
        autocomplete="username" 
        class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm shadow-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
      />
      @if (show('username')) {
        <div class="mt-1 text-xs text-red-500">Username must be at least 3 characters</div>
      }
    </label>

   
    <label class="block">
      <span class="block text-sm font-medium text-slate-700 mb-1">Email</span>
      <input 
        type="email" 
        formControlName="email" 
        autocomplete="email" 
        class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm shadow-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
      />
      @if (show('email')) {
        <div class="mt-1 text-xs text-red-500">Enter a valid email</div>
      }
    </label>

   
    <label class="block">
      <span class="block text-sm font-medium text-slate-700 mb-1">Password</span>
      <input 
        type="password" 
        formControlName="password" 
        autocomplete="new-password" 
        class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm shadow-sm placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
      />
      @if (show('password')) {
        <div class="mt-1 text-xs text-red-500">Password must be at least 8 characters</div>
      }
    </label>

   
    <label class="block">
      <span class="block text-sm font-medium text-slate-700 mb-1">I want to</span>
      <select 
        formControlName="role" 
        class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
      >
        @for (r of roles; track r) {
          <option [value]="r">{{ r }}</option>
        }
      </select>
    </label>
  </div>

  <button 
    type="submit" 
    [disabled]="loading()" 
    class="w-full mt-6 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 text-white font-medium rounded-lg text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors disabled:cursor-not-allowed"
  >
    {{ loading() ? 'Creating account...' : 'Sign up' }}
  </button>

 
  <p class="mt-4 text-center text-sm text-slate-600">
    Already registered? 
    <a routerLink="/login" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Log in</a>
  </p>
</form>
