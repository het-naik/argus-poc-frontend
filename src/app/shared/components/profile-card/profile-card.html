<!-- profile-card.html -->
<div class="w-full mx-auto flex justify-between items-center bg-white rounded-2xl p-5 transition-shadow duration-300">
  <div class="flex items-center gap-4">
    <div class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-semibold text-lg border border-indigo-100">
      {{ initial() }}
    </div>

    <div class="flex flex-col items-start">
      <div class="text-slate-800 font-semibold text-base tracking-tight">{{ user().username }}</div>
      <div class="text-slate-400 text-sm font-medium">{{ user().email }}</div>
    </div>
  </div>

  <div>
    <button
      matButton="outlined"
      (click)="openEditDialog()"
      class="px-4 py-2 text-sm font-semibold text-indigo-600 bg-white hover:bg-indigo-50 border border-indigo-200 hover:border-indigo-300 rounded-xl transition-colors duration-200 cursor-pointer shadow-xs"
    >
      Edit Profile
    </button>
  </div>
</div>
