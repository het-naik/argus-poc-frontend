<h2 mat-dialog-title>Update status for order #{{ data.orderId }}</h2>

    <mat-dialog-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Status</mat-label>
        <mat-select [formControl]="statusControl">
          @for (s of statuses; track s) {
            <mat-option [value]="s">{{ s }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button mat-dialog-close>Cancel</button>
      <button
        mat-flat-button
        [disabled]="statusControl.invalid || statusControl.value === data.currentStatus"
        (click)="save()"
      >
        Update
      </button>
    </mat-dialog-actions>
